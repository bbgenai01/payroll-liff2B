<!--
  หน้าปฏิทินงาน/วันหยุด สำหรับพนักงาน (LIFF แยก URL ของตัวเอง)
  อัปโหลดไฟล์นี้ขึ้น GitHub repo เดิม แล้วตั้ง Endpoint URL ของ LIFF อันใหม่เป็น
  https://bbgenai01.github.io/payroll-liff2B/calendar.html
  LIFF ID ของปฏิทินใส่ไว้ให้แล้ว (2010792715-LiZuuYwV) — ใช้ Apps Script / Web App URL ตัวเดิมร่วมกับระบบลา
-->
<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ปฏิทินงาน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" onerror="showConnectRetry_('โหลด LINE SDK ไม่สำเร็จ (เช็คสัญญาณอินเทอร์เน็ต)')"></script>
<style>
  :root{ --primary:#d97706; --primary-dark:#b45309; --bg:#f3f4f6; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; }
  *{box-sizing:border-box;}
  body{ font-family:'Sarabun','Tahoma',sans-serif; margin:0; background:var(--bg); color:var(--text); font-size:15px; }
  header{ background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:16px; text-align:center; }
  header h1{ margin:0; font-size:18px; }
  header p{ margin:4px 0 0; font-size:12px; opacity:.9; }
  main{ padding:14px; max-width:480px; margin:0 auto; }
  .card{ background:#fff; border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2{ margin:0 0 10px; font-size:16px; }
  .hint{ font-size:12px; color:var(--muted); }
  button.btn{ width:100%; padding:12px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  #loadingBox, #linkBox{ text-align:center; padding:40px 16px; }
  input{ width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:15px; font-family:inherit; }
  /* ---- หัวเดือน + ปุ่มเลื่อนเดือน ---- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .cal-nav .mth{ font-weight:700; font-size:16px; }
  .cal-nav button{ border:1px solid var(--border); background:#fff; color:var(--text); width:38px; height:38px;
    border-radius:9px; font-size:18px; cursor:pointer; font-family:inherit; flex:0 0 auto; }
  .cal-nav button:disabled{ opacity:.3; }
  /* ---- ตารางปฏิทิน ---- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--muted); font-weight:700; padding:4px 0; }
  .cal-cell{ aspect-ratio:1/1; border-radius:9px; background:#fff; border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:5px; font-size:13px; cursor:pointer; position:relative; }
  .cal-cell.blank{ background:transparent; border-color:transparent; cursor:default; }
  .cal-cell.today{ border-color:var(--primary); border-width:2px; font-weight:700; }
  .cal-cell.sel{ background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
  .cal-cell.sel .dots i{ box-shadow:0 0 0 1.5px #fff; }
  .cal-cell .dots{ display:flex; gap:2.5px; margin-top:3px; height:7px; align-items:center; }
  .cal-cell .dots i{ width:6px; height:6px; border-radius:50%; display:block; }
  .dot-holiday{ background:#dc2626; }
  .dot-task{ background:#7c3aed; }
  .dot-overdue{ background:#f59e0b; }
  .cal-cell .more{ font-size:8px; color:var(--muted); line-height:1; }
  .cal-cell.sel .more{ color:#fff; }
  /* ---- กล่องรายละเอียดของวันที่เลือก ---- */
  .day-detail-head{ font-weight:700; font-size:15px; margin-bottom:8px; }
  .ev{ padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; display:flex; gap:9px; align-items:flex-start; }
  .ev:last-child{ border-bottom:none; }
  .ev .dot{ flex:0 0 auto; }
  .overdue-badge{ display:inline-block; background:#fef3c7; color:#92400e; font-size:10.5px; font-weight:700;
    border-radius:8px; padding:1px 6px; margin-left:5px; white-space:nowrap; }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:10px; }
  .legend span{ display:flex; align-items:center; gap:4px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:block; }
  .overdue-bar{ background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:9px;
    padding:9px 11px; font-size:13px; margin-bottom:12px; cursor:pointer; font-weight:600; }
</style>
</head>
<body>

<header>
  <h1>📅 ปฏิทินงาน</h1>
  <p id="empNameTag">กำลังโหลด...</p>
</header>

<div id="loadingBox">
  <p>กำลังเชื่อมต่อ LINE...</p>
  <div id="connectRetryBox" style="display:none; margin-top:10px;">
    <p class="hint" id="connectRetryMsg" style="color:var(--primary);">เชื่อมต่อ LINE ไม่สำเร็จ หรือใช้เวลานานผิดปกติ</p>
    <button class="btn" style="max-width:220px;margin:0 auto;" onclick="location.reload()">🔄 ลองใหม่อีกครั้ง</button>
  </div>
</div>

<div id="linkBox" style="display:none;">
  <div class="card" style="max-width:400px;margin:20px auto;">
    <h2>ยืนยันตัวตนครั้งแรก</h2>
    <p class="hint">กรอกรหัสพนักงานของคุณ (สอบถามจากแอดมิน) เพื่อผูกบัญชี LINE นี้กับข้อมูลพนักงาน</p>
    <div style="margin:10px 0;"><input type="text" id="linkCode" placeholder="เช่น 1008"></div>
    <button class="btn" onclick="doLink()">ยืนยัน</button>
    <p class="hint" id="linkError" style="color:var(--primary); display:none;"></p>
  </div>
</div>

<main id="mainApp" style="display:none;">
  <div class="card">
    <div id="overdueBar" class="overdue-bar" style="display:none;" onclick="showOverdue()"></div>
    <div class="cal-nav">
      <button type="button" id="btnPrev" onclick="moveMonth(-1)">‹</button>
      <div class="mth" id="calMonthLabel">—</div>
      <button type="button" id="btnNext" onclick="moveMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"><p class="hint">กำลังโหลด...</p></div>
    <div class="legend">
      <span><i class="dot-holiday"></i> วันหยุด</span>
      <span><i class="dot-task"></i> งานครบกำหนด</span>
      <span><i class="dot-overdue"></i> งานค้าง</span>
    </div>
  </div>
  <div class="card">
    <div id="dayDetail"><p class="hint">แตะวันที่ในปฏิทินเพื่อดูรายละเอียด</p></div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw8Fbc2o-ljzKKC4SxU1BLB5G-T6mOMav2A3AIRpnf-R_o1-29FKoSxAjcwgTXr7f3_/exec';
// LIFF ID ของ "ปฏิทิน" (คนละอันกับระบบลา — ระบบลาคือ 2010792715-tsR0YQFR)
const LIFF_ID = '2010792715-LiZuuYwV';
let EMP_ID = null, EMP_NAME = null, LINE_USER_ID = null;

// ระยะเวลาที่แสดงล่วงหน้า แยกกันระหว่างวันหยุดกับงาน (ปรับตัวเลขตรงนี้ได้เลย)
const HOLIDAY_AHEAD_DAYS = 120;  // วันหยุด — มองไกล เพราะใช้วางแผนล่วงหน้า
const TASK_AHEAD_DAYS    = 60;   // งานจาก Asana — มองใกล้ เอาเฉพาะที่ต้องทำเร็วๆ นี้
const BACK_DAYS          = 60;   // งานค้างที่เลยกำหนดแล้ว ย้อนหลังกี่วัน

const DEBUG_MODE_ = new URLSearchParams(location.search).get('debug') === '1';
function debugLog(msg){
  if(!DEBUG_MODE_) return;
  document.getElementById('loadingBox').innerHTML += '<p style="font-size:12px;color:#666;text-align:left;margin:4px 0;">'+msg+'</p>';
}
function showConnectRetry_(msg){
  const box = document.getElementById('connectRetryBox');
  if(!box) return;
  document.getElementById('connectRetryMsg').textContent = msg || 'เชื่อมต่อ LINE ไม่สำเร็จ หรือใช้เวลานานผิดปกติ';
  box.style.display = 'block';
}
async function apiGet(action, params){
  const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({action}, payload))
  });
  return res.json();
}
function initApp(){
  debugLog('LIFF_ID = ' + LIFF_ID);
  if(typeof liff === 'undefined'){
    showConnectRetry_('โหลด LINE SDK ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    return;
  }
  let settled = false;
  setTimeout(()=>{
    if(!settled) showConnectRetry_('เชื่อมต่อ LINE ใช้เวลานานผิดปกติ ลองกดปุ่มด้านล่างเพื่อโหลดใหม่');
  }, 8000);
  liff.init({ liffId: LIFF_ID }).then(()=>{
    settled = true;
    if(!liff.isLoggedIn()){ liff.login(); return Promise.reject('__redirecting__'); }
    return liff.getProfile();
  }).then(profile=>{
    settled = true;
    LINE_USER_ID = profile.userId;
    checkLink();
  }).catch(err=>{
    settled = true;
    if(err==='__redirecting__') return;
    debugLog('❌ ' + JSON.stringify(err));
    showConnectRetry_('เชื่อมต่อ LINE ไม่สำเร็จ ลองกดปุ่มด้านล่างเพื่อโหลดใหม่');
  });
}
function checkLink(){
  apiGet('getProfile', { lineUserId: LINE_USER_ID }).then(r=>{
    document.getElementById('loadingBox').style.display='none';
    if(r.linked){
      EMP_ID = r.empId; EMP_NAME = r.name;
      startMainApp();
    } else {
      document.getElementById('linkBox').style.display='block';
    }
  }).catch(()=> showConnectRetry_('โหลดข้อมูลพนักงานไม่สำเร็จ ลองใหม่อีกครั้ง'));
}
function doLink(){
  const code = document.getElementById('linkCode').value.trim();
  if(!code) return;
  apiPost('linkEmployee', { lineUserId: LINE_USER_ID, empCode: code }).then(r=>{
    if(r.error){
      document.getElementById('linkError').textContent = r.error;
      document.getElementById('linkError').style.display='block';
      return;
    }
    EMP_ID = r.empId; EMP_NAME = r.name;
    document.getElementById('linkBox').style.display='none';
    startMainApp();
  });
}
function startMainApp(){
  document.getElementById('empNameTag').textContent = EMP_NAME || '';
  document.getElementById('mainApp').style.display='block';
  loadCalendar();
}
const THAI_MONTHS_ = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_DOW_ = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function thaiDateLabel_(dateStr){
  const p = String(dateStr).split('-').map(Number);
  if(!p[0] || !p[1] || !p[2]) return dateStr;
  return `${p[2]} ${THAI_MONTHS_[p[1]]} ${p[0]+543}`;
}
function dowLabel_(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d) ? '' : THAI_DOW_[d.getDay()];
}
function todayISO_(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDaysISO_(iso, days){
  const p = String(iso).split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml_(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const THAI_MONTHS_FULL_ = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DOW_SHORT_ = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const SOURCE_ICON_ = { holiday:'🔴', asana:'🟣', teamtask:'🟣', manual:'🔵' };

// สถานะของหน้าปฏิทิน
let EVENTS_BY_DATE = {};   // { 'YYYY-MM-DD': [event, ...] }
let VIEW_Y = 0, VIEW_M = 0;   // เดือนที่กำลังดูอยู่ (M = 1-12)
let MIN_YM = '', MAX_YM = '';  // ขอบเขตเดือนที่มีข้อมูล กันเลื่อนไปเรื่อยๆ จนเจอแต่หน้าว่าง
let SELECTED_DATE = '';

function ymKey_(y, m){ return y + '-' + String(m).padStart(2,'0'); }

function loadCalendar(){
  apiGet('getCalendar', { days: HOLIDAY_AHEAD_DAYS, back: BACK_DAYS, empId: EMP_ID }).then(all=>{
    // ขอข้อมูลมาช่วงยาวสุด (เท่าวันหยุด) แล้วค่อยตัดงานที่ไกลเกิน TASK_AHEAD_DAYS ออกตรงนี้
    // วันหยุดจึงมองไกลได้ 120 วัน ส่วนงานเห็นแค่ 60 วัน
    const taskCutoff = addDaysISO_(todayISO_(), TASK_AHEAD_DAYS);
    const rows = (all && all.length && !all.error)
      ? all.filter(r=> r.source === 'holiday' ? true : r.date <= taskCutoff)
      : [];

    EVENTS_BY_DATE = {};
    rows.forEach(r=>{ (EVENTS_BY_DATE[r.date] = EVENTS_BY_DATE[r.date] || []).push(r); });

    const today = todayISO_();
    const dates = Object.keys(EVENTS_BY_DATE).sort();
    // ให้เลื่อนดูได้ตั้งแต่เดือนของข้อมูลแรกสุด ถึงเดือนของข้อมูลท้ายสุด (อย่างน้อยต้องครอบเดือนปัจจุบัน)
    MIN_YM = dates.length ? dates[0].slice(0,7) : today.slice(0,7);
    MAX_YM = dates.length ? dates[dates.length-1].slice(0,7) : today.slice(0,7);
    if(MIN_YM > today.slice(0,7)) MIN_YM = today.slice(0,7);
    if(MAX_YM < today.slice(0,7)) MAX_YM = today.slice(0,7);

    const tp = today.split('-').map(Number);
    VIEW_Y = tp[0]; VIEW_M = tp[1];
    SELECTED_DATE = today;

    renderOverdueBar_(rows);
    renderMonth_();
    renderDayDetail_(today);
  }).catch(()=>{
    document.getElementById('calGrid').innerHTML = '<p class="hint">โหลดปฏิทินไม่สำเร็จ ลองใหม่อีกครั้ง</p>';
  });
}

function renderOverdueBar_(rows){
  const bar = document.getElementById('overdueBar');
  const n = rows.filter(r=> r.overdue && r.source !== 'holiday').length;
  if(!n){ bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  bar.textContent = '⚠️ มีงานค้างเลยกำหนดแล้ว ' + n + ' รายการ — แตะเพื่อดู';
}
function showOverdue(){
  const list = [];
  Object.keys(EVENTS_BY_DATE).sort().forEach(d=>{
    EVENTS_BY_DATE[d].forEach(ev=>{ if(ev.overdue && ev.source !== 'holiday') list.push(ev); });
  });
  SELECTED_DATE = '';
  renderMonth_();
  const box = document.getElementById('dayDetail');
  box.innerHTML = '<div class="day-detail-head">⚠️ งานค้างทั้งหมด (' + list.length + ')</div>'
    + list.map(ev=>`
      <div class="ev">
        <span class="dot"><i style="display:block;width:8px;height:8px;border-radius:50%;margin-top:5px;" class="dot-overdue"></i></span>
        <span>${escapeHtml_(ev.title)}
          <span class="overdue-badge">${thaiDateLabel_(ev.date)}</span>
          ${ev.detail? '<br><span class="hint">'+escapeHtml_(ev.detail)+'</span>' : ''}</span>
      </div>`).join('');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

function moveMonth(step){
  let y = VIEW_Y, m = VIEW_M + step;
  if(m < 1){ m = 12; y--; }
  if(m > 12){ m = 1; y++; }
  const key = ymKey_(y, m);
  if(key < MIN_YM || key > MAX_YM) return;
  VIEW_Y = y; VIEW_M = m;
  renderMonth_();
}

function dotClassFor_(ev){
  if(ev.source === 'holiday') return 'dot-holiday';
  return ev.overdue ? 'dot-overdue' : 'dot-task';
}

function renderMonth_(){
  document.getElementById('calMonthLabel').textContent = THAI_MONTHS_FULL_[VIEW_M] + ' ' + (VIEW_Y + 543);
  const cur = ymKey_(VIEW_Y, VIEW_M);
  document.getElementById('btnPrev').disabled = (cur <= MIN_YM);
  document.getElementById('btnNext').disabled = (cur >= MAX_YM);

  const today = todayISO_();
  const firstDow = new Date(VIEW_Y, VIEW_M-1, 1).getDay();      // 0 = อาทิตย์
  const daysInMonth = new Date(VIEW_Y, VIEW_M, 0).getDate();

  let html = THAI_DOW_SHORT_.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0; i<firstDow; i++) html += '<div class="cal-cell blank"></div>';

  for(let d=1; d<=daysInMonth; d++){
    const iso = `${VIEW_Y}-${String(VIEW_M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = EVENTS_BY_DATE[iso] || [];
    // แสดงจุดสีไม่เกิน 3 จุด ถ้าเกินใส่ + ต่อท้าย เพื่อไม่ให้ช่องแน่นเกินไปบนมือถือ
    const dots = evs.slice(0,3).map(ev=>`<i class="${dotClassFor_(ev)}"></i>`).join('');
    const more = evs.length > 3 ? `<div class="more">+${evs.length-3}</div>` : '';
    const cls = 'cal-cell'
      + (iso === today ? ' today' : '')
      + (iso === SELECTED_DATE ? ' sel' : '');
    html += `<div class="${cls}" onclick="selectDay('${iso}')">
      <div>${d}</div><div class="dots">${dots}</div>${more}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function selectDay(iso){
  SELECTED_DATE = iso;
  renderMonth_();
  renderDayDetail_(iso);
}

function renderDayDetail_(iso){
  const box = document.getElementById('dayDetail');
  const evs = EVENTS_BY_DATE[iso] || [];
  const isToday = iso === todayISO_();
  let html = '<div class="day-detail-head">'
    + thaiDateLabel_(iso) + ' (' + dowLabel_(iso) + ')'
    + (isToday ? ' <span class="overdue-badge" style="background:#fee2e2;color:#991b1b;">วันนี้</span>' : '')
    + '</div>';
  if(!evs.length){
    html += '<p class="hint">ไม่มีวันหยุดหรืองานในวันนี้</p>';
  } else {
    html += evs.map(ev=>`
      <div class="ev">
        <span class="dot">${SOURCE_ICON_[ev.source]||'•'}</span>
        <span>${escapeHtml_(ev.title)}
          ${ev.overdue && ev.source!=='holiday' ? '<span class="overdue-badge">เลยกำหนด</span>' : ''}
          ${ev.detail? '<br><span class="hint">'+escapeHtml_(ev.detail)+'</span>' : ''}</span>
      </div>`).join('');
  }
  box.innerHTML = html;
}
initApp();
</script>
</body>
</html>
